name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      # pgvector's official image = Postgres with the vector extension
      # available, so init_schema's `CREATE EXTENSION vector` works.
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rag_codebase
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/rag_codebase

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Install the slim deps (no torch/sentence-transformers) plus pytest.
      # The tests cover chunker correctness and schema/pgvector init — neither
      # needs the heavy local-embedding stack, so CI stays fast.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-deploy.txt pytest

      - name: Run tests
        run: python -m pytest -q

  # Actually build and boot the docker-compose stack and hit the health
  # endpoint, so the one-command quickstart is verified end-to-end rather
  # than assumed. Slower than the unit tests (it builds the torch image), so
  # it's a separate job.
  docker-compose-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and start the stack
        run: docker compose up -d --build

      - name: Wait for the app to become healthy
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8000/health; then
              echo "app healthy"; exit 0
            fi
            sleep 5
          done
          echo "app never became healthy" >&2
          docker compose logs
          exit 1

      - name: Index a small repo and confirm it reaches 'ready'
        run: |
          curl -sf -X POST http://localhost:8000/api/repos \
            -H "Content-Type: application/json" \
            -d '{"url": "https://github.com/Shreyash021104/holi"}'
          for i in $(seq 1 60); do
            status=$(curl -sf http://localhost:8000/api/repos/1 | python3 -c "import json,sys; print(json.load(sys.stdin)['status'])" || echo pending)
            echo "status: $status"
            [ "$status" = "ready" ] && exit 0
            [ "$status" = "failed" ] && { docker compose logs app; exit 1; }
            sleep 5
          done
          echo "indexing did not finish" >&2; exit 1

      - name: Tear down
        if: always()
        run: docker compose down -v
