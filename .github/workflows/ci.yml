name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      # pgvector's official image = Postgres with the vector extension
      # available, so init_schema's `CREATE EXTENSION vector` works.
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rag_codebase
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/rag_codebase

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Install the slim deps (no torch/sentence-transformers) plus pytest.
      # The tests cover chunker correctness and schema/pgvector init — neither
      # needs the heavy local-embedding stack, so CI stays fast.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-deploy.txt pytest

      - name: Run tests
        run: python -m pytest -q
